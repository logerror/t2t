<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>T2T Web Terminal</title>
    <link rel="stylesheet" href="/static/css/xterm.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #1e1e1e;
            overflow: hidden;
        }
        #terminal-dr {
            height: 99%;
            width: 100%;
        }
    </style>
</head>
<body>
<div class="main-bg">
    <div class="main-card terminal-card">
    <div class="terminal-header">
            <span class="host-info">Terminal 2 Terminal <span id="hostInfo"></span></span>
            <span class="connection-status connected" id="connStatus">已连接</span>
    </div>
    <div id="terminal-dr"></div>
    <div class="terminal-footer">
            <span class="host-info">Vim编辑模式下如有异常使用 Ctrl + C 退出编辑模式</span>
            <button class="action-btn disconnect-btn" onclick="window.close()">断开连接</button>
        </div>
    </div>
</div>
<script src="/static/js/xterm.min.js"></script>
<script src="/static/js/xterm-addon-fit.min.js"></script>
<script src="/static/js/xterm-addon-attach.min.js"></script>
<script src="/static/js/terminal.js"></script>
<script>
    // 动态渲染 hostTag/clientId
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const hostTag = urlParams.get('hostTag');
        const clientId = urlParams.get('clientId');
        if (hostTag && clientId) {
            document.getElementById('hostInfo').textContent = `>>> ${hostTag}:${clientId}`;
        }
    });
</script>
</body>
</html>
