<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T2T Web Terminal</title>
    <link rel="icon" href="/static/image/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/xterm.min.css">
    <link rel="stylesheet" href="/static/css/fontgoogle.css?v=20260709c">
    <link rel="stylesheet" href="/static/css/terminal.css?v=20260709c">
</head>
<body>
    <div class="main-bg">
        <div class="main-card terminal-card">
            <header class="terminal-header">
                <div class="terminal-title-group">
                    <h1>Terminal 2 Terminal</h1>
                    <p id="terminalTarget">等待连接目标...</p>
                </div>
                <span class="connection-status connected" id="connStatus">已连接</span>
            </header>

            <main class="terminal-body">
                <div id="terminal-dr"></div>
            </main>

            <footer class="terminal-footer">
                <span class="terminal-hint">提示：Vim 编辑模式异常时可尝试 <code>Ctrl + C</code> 退出编辑。</span>
                <button class="disconnect-btn" type="button" onclick="disconnectTerminal()">断开连接</button>
            </footer>
        </div>
    </div>

    <script src="/static/js/xterm.min.js"></script>
    <script src="/static/js/xterm-addon-fit.min.js"></script>
    <script src="/static/js/xterm-addon-attach.min.js"></script>
    <script src="/static/js/terminal.js?v=20260709c"></script>
    <script>
        function disconnectTerminal() {
            if (confirm("确定要断开连接吗？")) {
                window.close();
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const hostTag = params.get("hostTag") || "-";
            const clientId = params.get("clientId") || "-";
            const target = document.getElementById("terminalTarget");
            target.textContent = `会话目标：${hostTag}:${clientId}`;

            document.addEventListener("keydown", (event) => {
                if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "w") {
                    event.preventDefault();
                    disconnectTerminal();
                }
            });
        });
    </script>
</body>
</html>
