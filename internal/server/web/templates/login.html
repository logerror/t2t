<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Terminal 2 Terminal</title>
    <link rel="icon" href="/static/image/favicon.ico" type="image/x-icon">
    <link href="/static/css/fontgoogle.css?v=20260709c" rel="stylesheet">
    <link href="/static/css/login.css?v=20260709c" rel="stylesheet">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <img class="login-logo" src="/static/image/favicon.ico" alt="t2t logo">
                <div>
                    <h1>Terminal 2 Terminal</h1>
                    <p>统一管理远程终端连接与协作访问</p>
                </div>
            </div>

            <form class="login-form" id="loginForm" autocomplete="off">
                <label class="field-label" for="username">用户名</label>
                <input class="input-control" type="text" id="username" name="username" placeholder="请输入用户名" required autofocus>

                <label class="field-label" for="password">密码</label>
                <input class="input-control" type="password" id="password" name="password" placeholder="请输入密码" required>

                <div class="login-error" id="loginError" aria-live="polite"></div>
                <button type="submit" id="loginBtn" class="login-btn">登录</button>
            </form>

            <p class="login-help">默认本地账号：<code>admin / admin123</code>（生产环境请务必修改）</p>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const errorDiv = document.getElementById("loginError");
            const loginBtn = document.getElementById("loginBtn");

            errorDiv.textContent = "";
            loginBtn.disabled = true;

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user: username, password }),
                });

                const data = await response.json();
                if (response.ok && data.token) {
                    document.cookie = `token=${data.token}; path=/`;
                    window.location.href = "/";
                    return;
                }
                errorDiv.textContent = data.error || "登录失败，请检查用户名和密码。";
            } catch (error) {
                console.error("login request failed", error);
                errorDiv.textContent = "网络异常，请稍后重试。";
            } finally {
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
